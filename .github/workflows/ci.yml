name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build-chrome-ext
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ github.sha }}
          path: chromeExt/dist/ext.zip
          if-no-files-found: error
          retention-days: 7
